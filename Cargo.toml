[workspace]
members = [".", "pp-issuer"]
resolver = "2"

[package]
name = "moat"
version = "0.1.0"
edition = "2021"
description = "Moat — MoQ Auth Token service. Pluggable IdP, scoped token minting, room management."
license = "MIT OR Apache-2.0"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["tokio", "json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / Crypto
openidconnect = "4"
jsonwebtoken = "9"
cat-token = "0.1.3"
p256 = "0.13"

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
rand = "0.9"
